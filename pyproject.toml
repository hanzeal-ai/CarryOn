[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "carryon-local"
version = "0.2.0"
description = "Local Codex desktop bridge, CLI and outbound cloud connector"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
carryon = "carryon.cli:main"
carryon-gateway = "carryon.gateway:main"
carryon-console = "carryon.console:main"

[tool.setuptools]
packages = ["carryon"]

[tool.setuptools.package-data]
carryon = ["native_contracts.json", "web/*"]
