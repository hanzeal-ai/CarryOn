# Optional drop-in for connectnow-gateway.service after configuring publicUrl and consoleToken.
# Install as /etc/systemd/system/connectnow-gateway.service.d/console.conf only after review.
[Service]
ExecStart=
ExecStart=/usr/bin/python3.11 -m connectnow.console serve --config /etc/connectnow/gateway.json --state-dir /var/lib/connectnow-console --port 8780
StateDirectory=connectnow-console
StateDirectoryMode=0700
