# Optional drop-in for carryon-gateway.service after configuring publicUrl and consoleToken.
# Install as /etc/systemd/system/carryon-gateway.service.d/console.conf only after review.
[Service]
ExecStart=
ExecStart=/usr/bin/python3.11 -m carryon.console serve --config /etc/carryon/gateway.json --state-dir /var/lib/carryon-console --port 8780
StateDirectory=carryon-console
StateDirectoryMode=0700
