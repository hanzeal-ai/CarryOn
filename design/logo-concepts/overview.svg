<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1060" role="img" aria-label="三个产品 Logo 设计方向"><title>三个产品 Logo 设计方向</title><rect width="1500" height="1060" fill="#F5F5F1"/><text x="60" y="65" fill="#687078" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="14" font-weight="600">PRODUCT SYMBOL EXPLORATIONS</text><text x="60" y="120" fill="#222A32" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="38" font-weight="600">任务在继续，你始终在场。</text><text x="60" y="158" fill="#687078" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="17" font-weight="400">基于跨端会话、任务接续与远程审批的三个视觉方向 · 独立于产品名称</text><rect x="60" y="202" width="440" height="746" rx="18" fill="#FFFFFF"/><text x="88" y="244" fill="#222A32" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="600">01 / 接续</text><text x="399" y="244" fill="#167D91" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="13" font-weight="600">推荐</text><g transform="translate(172 286) scale(2.25)"><path fill="#222A32" d="M39 16H27C16 16 10 22 10 33v17c0 11 6 17 17 17h9l12-12H28c-4 0-6-2-6-6V34c0-4 2-6 6-6h11Z"/><path fill="#222A32" d="M57 80h12c11 0 17-6 17-17V46c0-11-6-17-17-17h-9L48 41h20c4 0 6 2 6 6v15c0 4-2 6-6 6H57Z"/><path d="m35 61 26-26" fill="none" stroke="#167D91" stroke-width="12" stroke-linecap="round"/></g><text x="88" y="552" fill="#222A32" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="20" font-weight="500">同一任务，跨端接续。</text><text x="88" y="584" fill="#687078" font-family="Helvetica Neue, PingFang SC, sans-serif" font-size="14" font-weight="400">两个开放端口，由一条连续的斜向笔画接通。</text><rect x="80" y="618" width="400" height="150" rx="12" fill="#18232B"/><g transform="translate(103 645) scale(1.0)"><path fill="#FFFFFF" d="M39 16H27C16 16 10 22 10 33v17c0 11 6 17 17 17h9l12-12H28c-4 0-6-2-6-6V34c0-4 2-6 6-6h11Z"/><path fill="#FFFFFF" d="M57 80h12c11 0 17-6 17-17V46c0-11-6-17-17-17h-9L48 41h20c4 0 6 2 6 6v15c0 4-2 6-6 6H57Z"/><path d="